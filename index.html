<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Desbloqueo de Netbooks</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; color: #333; }
        form { max-width: 450px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); margin: auto; }
        .grupo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #004085; }
        h2 { text-align: center; color: #0056b3; }
    </style>
</head>
<body>

    <h2>Solicitud de Código de Desbloqueo</h2>
    
    <form action="https://script.google.com/macros/s/AKfycbwUnhfPw0f2KYz597BT1rYherg-o3Gk0_x0gg1FdnsbBVIg2upcJKDtbfpWiNVYvKeN5A/exec" method="POST">
        
        <div class="grupo">
            <label>Nombre:</label>
            <input type="text" name="Nombre" required>
        </div>
        <div class="grupo">
            <label>Apellido:</label>
            <input type="text" name="Apellido" required>
        </div>
        <div class="grupo">
            <label>DNI Titular:</label>
            <input type="text" name="DNI_Titular" required>
        </div>
        <div class="grupo">
            <label>Email de Contacto:</label>
            <input type="email" name="Email_Contacto" required>
        </div>
        <div class="grupo">
            <label>CUE Colegio:</label>
            <input type="text" name="CUE_Colegio" required>
        </div>
        <div class="grupo">
            <label>Número de Serie (S/N):</label>
            <input type="text" name="Numero_Serie_SN" required>
        </div>
        <div class="grupo">
            <label>Hardware ID:</label>
            <input type="text" name="Hardware_ID" required>
        </div>
        <div class="grupo">
            <label>Boot Tick:</label>
            <input type="text" name="Boot_Tick" required>
        </div>

        <button type="submit">Enviar Solicitud</button>
    </form>

</body>
</html>
