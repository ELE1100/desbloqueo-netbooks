<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Desbloqueo de Equipos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h2 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        .section-title { font-size: 14px; color: #007bff; text-transform: uppercase; font-weight: bold; margin-top: 20px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        
        .support-info { margin-top: 25px; padding-top: 15px; border-top: 2px dashed #ddd; text-align: center; font-size: 13px; color: #666; line-height: 1.5; }
        .support-info a { color: #007bff; text-decoration: none; font-weight: bold; }
        .support-info a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Formulario de Desbloqueo</h2>
    <div class="subtitle">Completá los datos para generar el correo de solicitud</div>
    
    <form id="desbloqueoForm">
        
        <div class="section-title">Datos del Solicitante</div>
        
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required placeholder="Tu primer y segundo nombre">
        </div>

        <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" required placeholder="Tu apellido completo">
        </div>

        <div class="form-group">
            <label for="dni">DNI del titular</label>
            <input type="text" id="dni" required placeholder="Sin puntos ni espacios">
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico de contacto</label>
            <input type="email" id="email" required placeholder="ejemplo@correo.com">
        </div>

        <div class="section-title">Datos del Establecimiento</div>

        <div class="form-group">
            <label for="cue">CUE del Colegio</label>
            <input type="text" id="cue" required placeholder="Ej: 220012300">
        </div>

        <div class="section-title">Datos Técnicos del Equipo</div>

        <div class="form-group">
            <label for="sn">Número de Serie (S/N)</label>
            <input type="text" id="sn" required placeholder="Ej: 1A2B3C4D5E">
        </div>

        <div class="form-group">
            <label for="hwid">Hardware ID</label>
            <input type="text" id="hwid" required placeholder="Ej: 00-11-22-33-44-55">
        </div>

        <div class="form-group">
            <label for="boottick">Boot Tick</label>
            <input type="text" id="boottick" required placeholder="Ej: 00 00">
        </div>

        <button type="submit">Generar y Enviar Correo</button>
    </form>

    <div class="support-info">
        ¿Tenés dudas o problemas con el formulario?<br>
        Contactate con Soporte Técnico: <a href="mailto:serviciotecnico@elechaco.edu.ar">serviciotecnico@elechaco.edu.ar</a>
    </div>
</div>

<script>
    document.getElementById('desbloqueoForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Evita errores de recarga o "405 Not Allowed"

        // Captura los valores ingresados por el usuario
        const nombre = document.getElementById('nombre').value;
        const apellido = document.getElementById('apellido').value;
        const dni = document.getElementById('dni').value;
        const email = document.getElementById('email').value;
        const cue = document.getElementById('cue').value;
        const sn = document.getElementById('sn').value;
        const hwid = document.getElementById('hwid').value;
        const boottick = document.getElementById('boottick').value;

        // Configura los destinatarios separados por coma
        const destinatarios = "MASS@educar.gob.ar,serviciotecnico@elechaco.edu.ar";
        
        // Define el asunto del correo electrónico
        const asunto = encodeURIComponent("SOLICITUD DE DESBLOQUEO: " + apellido + ", " + nombre);
        
        // Estructura el cuerpo del mensaje en texto limpio
        let cuerpo = "SOLICITUD DE CÓDIGO DE DESBLOQUEO\n\n";
        cuerpo += "DATOS DEL SOLICITANTE:\n";
        cuerpo += "- Nombre completo: " + nombre + " " + apellido + "\n";
        cuerpo += "- DNI Titular: " + dni + "\n";
        cuerpo += "- Email de Contacto: " + email + "\n\n";
        cuerpo += "DATOS DEL ESTABLECIMIENTO:\n";
        cuerpo += "- CUE Colegio: " + cue + "\n\n";
        cuerpo += "DATOS TÉCNICOS DE LA NETBOOK:\n";
        cuerpo += "- S/N (N° Serie): " + sn + "\n";
        cuerpo += "- Hardware ID: " + hwid + "\n";
        cuerpo += "- Boot Tick: " + boottick + "\n";
        
        const cuerpoFormateado = encodeURIComponent(cuerpo);

        // Abre el gestor de correo nativo (Gmail, Outlook, etc) sin intermediarios
        window.location.href = "mailto:" + destinatarios + "?subject=" + asunto + "&body=" + cuerpoFormateado;
    });
</script>

</body>
</html>
