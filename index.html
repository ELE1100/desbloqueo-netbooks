<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Desbloqueo de Netbooks</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; color: #333; }
        form { max-width: 450px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); margin: auto; }
        .grupo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #004085; }
        h2 { text-align: center; color: #0056b3; }
        #mensaje { text-align: center; margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 4px; }
        .exito { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <h2>Solicitud de Código de Desbloqueo</h2>
    
    <form id="formDesbloqueo">
        <div class="grupo">
            <label>Nombre:</label>
            <input type="text" name="Nombre" required>
        </div>
        <div class="grupo">
            <label>Apellido:</label>
            <input type="text" name="Apellido" required>
        </div>
        <div class="grupo">
            <label>DNI Titular:</label>
            <input type="text" name="DNI_Titular" required>
        </div>
        <div class="grupo">
            <label>Email de Contacto:</label>
            <input type="email" name="Email_Contacto" required>
        </div>
        <div class="grupo">
            <label>CUE Colegio:</label>
            <input type="text" name="CUE_Colegio" required>
        </div>
        <div class="grupo">
            <label>Número de Serie (S/N):</label>
            <input type="text" name="Numero_Serie_SN" required>
        </div>
        <div class="grupo">
            <label>Hardware ID:</label>
            <input type="text" name="Hardware_ID" required>
        </div>
        <div class="grupo">
            <label>Boot Tick:</label>
            <input type="text" name="Boot_Tick" required>
        </div>

        <button type="submit" id="btnEnviar">Enviar Solicitud</button>
        <div id="mensaje"></div>
    </form>

    <script>
        document.getElementById('formDesbloqueo').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            const msg = document.getElementById('mensaje');
            
            btn.disabled = true;
            btn.innerText = "Enviando...";
            msg.style.display = "none";

            // Enlace definitivo e independiente de la sesión
            const urlAppScript = "https://script.google.com/macros/s/AKfycbwUnhfPw0f2KYz597BT1rYherg-o3Gk0_x0gg1FdnsbBVIg2upcJKDtbfpWiNVYvKeN5A/exec";
            
            fetch(urlAppScript, {
                method: 'POST',
                mode: 'no-cors',
                body: new FormData(this)
            })
            .then(() => {
                msg.className = "exito";
                msg.innerText = "¡Solicitud enviada con éxito! La información fue registrada.";
                msg.style.display = "block";
                this.reset();
            })
            .catch(error => {
                msg.className = "error";
                msg.innerText = "Hubo un problema al procesar la solicitud.";
                msg.style.display = "block";
                console.error(error);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Enviar Solicitud";
            });
        });
    </script>

</body>
</html>
