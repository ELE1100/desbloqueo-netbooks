<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Desbloqueo de Netbooks</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; color: #333; }
        .formulario-contenedor { max-width: 450px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); margin: auto; }
        .grupo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #004085; }
        h2 { text-align: center; color: #0056b3; }
        #mensaje { text-align: center; margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 4px; }
        .exito { background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>

    <div class="formulario-contenedor">
        <h2>Solicitud de Código de Desbloqueo</h2>
        
        <div class="grupo">
            <label>Nombre:</label>
            <input type="text" id="Nombre" required>
        </div>
        <div class="grupo">
            <label>Apellido:</label>
            <input type="text" id="Apellido" required>
        </div>
        <div class="grupo">
            <label>DNI Titular:</label>
            <input type="text" id="DNI_Titular" required>
        </div>
        <div class="grupo">
            <label>Email de Contacto:</label>
            <input type="email" id="Email_Contacto" required>
        </div>
        <div class="grupo">
            <label>CUE Colegio:</label>
            <input type="text" id="CUE_Colegio" required>
        </div>
        <div class="grupo">
            <label>Número de Serie (S/N):</label>
            <input type="text" id="Numero_Serie_SN" required>
        </div>
        <div class="grupo">
            <label>Hardware ID:</label>
            <input type="text" id="Hardware_ID" required>
        </div>
        <div class="grupo">
            <label>Boot Tick:</label>
            <input type="text" id="Boot_Tick" required>
        </div>

        <button type="button" id="btnEnviar" onclick="enviarDatos()">Enviar Solicitud</button>
        <div id="mensaje"></div>
    </div>

    <script>
        function enviarDatos() {
            const btn = document.getElementById('btnEnviar');
            const msg = document.getElementById('mensaje');
            
            // Validar campos vacíos antes de enviar
            const campos = ['Nombre', 'Apellido', 'DNI_Titular', 'Email_Contacto', 'CUE_Colegio', 'Numero_Serie_SN', 'Hardware_ID', 'Boot_Tick'];
            for (let id of campos) {
                if (!document.getElementById(id).value) {
                    alert("Por favor, completa todos los campos del formulario.");
                    return;
                }
            }

            btn.disabled = true;
            btn.innerText = "Enviando...";
            msg.style.display = "none";

            // Armar el paquete de datos manualmente
            const formData = new FormData();
            campos.forEach(id => {
                formData.append(id, document.getElementById(id).value);
            });

            const urlAppScript = "https://google.com";
            
            fetch(urlAppScript, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            })
            .then(() => {
                msg.className = "exito";
                msg.innerText = "¡Solicitud enviada con éxito! La información fue registrada.";
                msg.style.display = "block";
                
                // Limpiar campos manualmente
                campos.forEach(id => document.getElementById(id).value = "");
            })
            .catch(error => {
                console.error(error);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Enviar Solicitud";
            });
        }
    </script>

</body>
</html>
